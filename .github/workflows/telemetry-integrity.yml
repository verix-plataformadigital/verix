name: Telemetry Integrity
on:
  pull_request:
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
  push:
    branches:
      - "fix/telemetry-integrity-*"
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check telemetry Edge Function
        run: deno check --no-lock supabase/functions/telemetry-v2/index.ts
      - name: Verify telemetry integrity contract
        run: node tools/verify-telemetry-integrity.mjs
