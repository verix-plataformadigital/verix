name: Telemetry Integrity
on:
  pull_request:
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
      - "tools/smoke-production-telemetry.mjs"
  push:
    branches:
      - "fix/telemetry-integrity-*"
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
      - "tools/smoke-production-telemetry.mjs"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify telemetry integrity contract
        run: node tools/verify-telemetry-integrity.mjs
      - name: Live production ingestion smoke test
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fix/telemetry-integrity-live-smoke-')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/telemetry-integrity-live-smoke-'))
        run: node tools/smoke-production-telemetry.mjs
