name: Telemetry Integrity
on:
  pull_request:
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
  push:
    branches:
      - "fix/telemetry-integrity-*"
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check telemetry Edge Function
        run: deno check --no-lock supabase/functions/telemetry-v2/index.ts
      - name: Verify telemetry integrity contract
        run: node tools/verify-telemetry-integrity.mjs
