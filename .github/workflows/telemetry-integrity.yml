name: Telemetry Integrity
on:
  pull_request:
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/functions/stats-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "tools/verify-asf-diagnostic-telemetry.mjs"
      - "tests/fixtures/asf-engine-baseline.txt"
      - "verix-app.html"
      - "verix-presence-v1.mjs"
      - "tools/verify-migration-filenames.mjs"
      - ".github/workflows/telemetry-integrity.yml"
  push:
    branches:
      - "main"
      - "fix/telemetry-integrity-*"
      - "fix/telemetry-diagnostics-*"
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/functions/stats-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
      - "tools/verify-migration-filenames.mjs"
      - ".github/workflows/telemetry-integrity.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate migration filename uniqueness
        run: node tools/verify-migration-filenames.mjs
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check telemetry Edge Function
        run: deno check --no-lock supabase/functions/telemetry-v2/index.ts
      - name: Type-check Admin statistics Edge Function
        run: deno check --no-lock supabase/functions/stats-v2/index.ts
      - name: Check realtime presence source syntax
        run: node --check verix-presence-v1.mjs
      - name: Build secure release and validate bundled presence
        run: |
          npm install --no-fund --no-audit
          npm run build:secure
          test -s dist/verix-presence-v1.js
          node --check dist/verix-presence-v1.js
          grep -q 'verix-presence-v1.js?v=' dist/verix-app.html
          grep -q 'verix-presence-v1.js?v=' dist/admin_v2.html
      - name: Verify telemetry integrity contract
        run: node tools/verify-telemetry-integrity.mjs
      - name: Verify ASF engine freeze and diagnostic telemetry
        run: node tools/verify-asf-diagnostic-telemetry.mjs
