name: Telemetry Integrity
on:
  pull_request:
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
  push:
    branches:
      - "fix/telemetry-integrity-*"
    paths:
      - "supabase/functions/telemetry-v2/index.ts"
      - "supabase/migrations/**"
      - "admin_v2.html"
      - "tools/verify-telemetry-integrity.mjs"
      - "verix-app.html"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify telemetry integrity contract
        run: node tools/verify-telemetry-integrity.mjs
