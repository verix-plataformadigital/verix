name: Experimental Windows ASF direct transport

on:
  push:
    branches:
      - experiment/asf-direct-native-transport-20261024
  pull_request:
    paths:
      - "windows/VerixPortable/**"
      - ".github/workflows/experimental-windows-asf.yml"
      - "docs/ASF_DIRECT_NATIVE_EXPERIMENT_2026-10-24.md"

permissions:
  contents: read

jobs:
  build-experimental:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Publish experimental portable host
        run: dotnet publish windows/VerixPortable/VerixPortable.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true
      - name: Upload test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VERIX-Windows-x64-ASF-direct-experiment
          path: windows/VerixPortable/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
