name: Cloudflare temporary IPify probe

on:
  push:
    branches:
      - experiment/cloudflare-ip-diagnostic
    paths:
      - "experiments/cloudflare-ip-temp-probe/**"
      - ".github/workflows/cloudflare-probe-temporary.yml"

permissions:
  contents: read

concurrency:
  group: verix-cloudflare-ip-temp-probe
  cancel-in-progress: false

jobs:
  deploy-and-test:
    name: Temporary deploy and IPify smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6

      - name: Deploy temporary Worker and test three times
        working-directory: experiments/cloudflare-ip-temp-probe
        shell: bash
        run: |
          set +e
          OUTPUT_FILE="$(mktemp)"
          npx --yes wrangler@4.136.3 deploy --temporary > "$OUTPUT_FILE" 2>&1
          DEPLOY_STATUS=$?
          set -e

          # The claim URL is a bearer credential: never print raw Wrangler output.
          CLAIM_URL="$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' "$OUTPUT_FILE" | head -n 1 || true)"
          if [[ -n "$CLAIM_URL" ]]; then
            echo "::add-mask::$CLAIM_URL"
          fi

          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$OUTPUT_FILE" | tail -n 1 || true)"
          if [[ $DEPLOY_STATUS -ne 0 || -z "$WORKER_URL" ]]; then
            echo "Temporary Cloudflare deployment failed or did not return a Worker URL."
            sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#<CLAIM_URL_REDACTED>#g' "$OUTPUT_FILE" | tail -n 35
            rm -f "$OUTPUT_FILE"
            exit 1
          fi

          echo "Temporary Worker deployed: $WORKER_URL"
          echo "Claim URL withheld from logs; this temporary deployment expires in about 60 minutes unless claimed."
          echo "Wrangler summary (claim URL redacted):"
          sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#<CLAIM_URL_REDACTED>#g' "$OUTPUT_FILE" | grep -E 'Temporary account ready|Account:|Claim within:|Claim URL:|Uploaded |Deployed |workers\.dev' | tail -n 12 || true
          echo "Waiting for the workers.dev route to propagate before testing."
          sleep 5
          echo "Running three fixed-target IPify checks; this does not contact ASF."

          WORKER_URL="$WORKER_URL" node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const results = [];
          for (let attempt = 1; attempt <= 3; attempt++) {
            if (attempt > 1) await new Promise(resolve => setTimeout(resolve, 2000));
            const start = Date.now();
            try {
              const response = await fetch(base + "/ip", {
                signal: AbortSignal.timeout(10000),
                cache: "no-store",
              });
              const contentType = response.headers.get("content-type") || "";
              const raw = await response.text();
              let body;
              try {
                body = JSON.parse(raw);
              } catch {
                body = null;
              }
              results.push({
                attempt,
                status: response.status,
                contentType,
                ok: response.ok && body?.ok === true,
                observedEgressIp: typeof body?.observedEgressIp === "string" ? body.observedEgressIp : undefined,
                elapsedMs: Date.now() - start,
                error: body?.error || undefined,
                bodyPrefix: body ? undefined : raw.slice(0, 140).replace(/https:\/\/dash\.cloudflare\.com\/claim-preview\?claimToken=[^\s"'<>]+/g, "<CLAIM_URL_REDACTED>"),
              });
            } catch (err) {
              results.push({ attempt, ok: false, elapsedMs: Date.now() - start, error: String(err).slice(0, 180) });
            }
          }
          console.log(JSON.stringify({
            test: "cloudflare-temporary-worker-ipify",
            results,
            distinctObservedIps: new Set(results.map(x => x.observedEgressIp).filter(Boolean)).size,
            note: "Observed IP variation is not guaranteed or promised by Cloudflare."
          }, null, 2));
          if (results.some(x => !x.ok)) process.exit(1);
          NODE
          STATUS=$?
          rm -f "$OUTPUT_FILE"
          exit $STATUS
