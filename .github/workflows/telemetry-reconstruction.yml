name: Telemetry Reconstruction Regression

on:
  push:
    branches: [telemetry-reconstruction]
  pull_request:
    branches: [main]
    paths:
      - 'verix-app.html'
      - 'admin_v2.html'
      - 'supabase/functions/stats-v2/**'
      - 'supabase/functions/telemetry-v2/**'
      - 'supabase/migrations/**'
      - 'tests/telemetry/**'
      - 'tools/verify-telemetry-reconstruction.mjs'
      - '.github/workflows/telemetry-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: Client and dashboard contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify telemetry contract and browser-script syntax
        run: node tools/verify-telemetry-reconstruction.mjs

  postgres-integration:
    name: Metric semantics and atomic telemetry ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: verix_telemetry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d verix_telemetry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d verix_telemetry_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Create isolated schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d verix_telemetry_test -v ON_ERROR_STOP=1 -f tests/telemetry/reconstruction.setup.sql
      - name: Apply proposed migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d verix_telemetry_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261009113000_rebuild_telemetry_metrics_and_atomic_ingest.sql
      - name: Verify query cohorts, conflicts, presence and idempotent ingest
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d verix_telemetry_test -v ON_ERROR_STOP=1 -f tests/telemetry/reconstruction.integration.sql
