name: VERIX quality gate

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run static audit
        run: node tools/verix-audit.mjs

      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts
