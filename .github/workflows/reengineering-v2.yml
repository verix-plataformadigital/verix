name: VÉRIX 2 Reengineering CI

on:
  push:
    branches: ["reengineering-v2"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Update npm resolver
        run: npm install --global npm@12.2.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Static repository audit
        run: node tools/audit-repository.mjs

      - name: V2 build
        run: npm run build:v2

      - name: Reject source maps
        shell: bash
        run: |
          if find dist-v2 -type f -name '*.map' | grep -q .; then
            echo "Source maps are not allowed in the V2 production artifact."
            exit 1
          fi

      - name: Upload audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verix-v2-audit
          path: audit-output/
          retention-days: 14
