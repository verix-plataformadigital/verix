name: VÉRIX 2 Reengineering CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verix-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Update npm resolver
        run: npm install --global npm@12.2.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Bootstrap dependency lockfile if missing
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
            npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          fi

      # Bootstrap only: once the generated lockfile exists on the branch, the
      # follow-up commit removes this step and uses npm ci exclusively.
      - name: Commit initial dependency lockfile
        if: steps.lockfile.outputs.missing == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'reengineering-v2'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible npm lockfile"
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Edge function typecheck
        run: npm run typecheck:edge

      - name: Telemetry event contract
        run: npm run verify:telemetry-contract

      - name: Unit tests
        run: npm test

      - name: Static repository audit
        run: node tools/audit-repository.mjs

      - name: V2 build
        run: npm run build:v2

      - name: V2 source security policy
        run: node tools/verify-v2-security.mjs

      - name: Windows host security policy
        run: node tools/verify-windows-host-security.mjs

      - name: Reject source maps
        shell: bash
        run: |
          if find dist-v2 -type f -name '*.map' | grep -q .; then
            echo "Source maps are not allowed in the V2 production artifact."
            exit 1
          fi

      - name: Prepare audit source snapshot
        shell: bash
        run: |
          mkdir -p audit-source
          cp verix-app.html audit-source/
          cp verix-mobile.html audit-source/
          cp verix-mobile.js audit-source/
          cp verix-mobile.css audit-source/
          cp admin_v2.html audit-source/
          cp supabase/functions/telemetry-v2/index.ts audit-source/telemetry-v2.ts
          cp supabase/functions/asf-proxy-v1/index.ts audit-source/asf-proxy-v1.ts
          cp supabase/functions/verix-gate-v1/index.ts audit-source/verix-gate-v1.ts
          cp package-lock.json audit-source/package-lock.json

      - name: Upload audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verix-v2-audit
          path: audit-output/
          retention-days: 14

      - name: Upload audit source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verix-v2-audit-source
          path: audit-source/
          retention-days: 7

  telemetry-ingest-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: verix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d verix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Verify PostgreSQL readiness
        env:
          PGPASSWORD: postgres
        run: |
          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d verix_test; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL service did not become ready."
          exit 1

      - name: Create disposable V2 telemetry schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d verix_test -v ON_ERROR_STOP=1 -f tests/database/atomic-telemetry-ingest.setup.sql

      - name: Apply atomic ingestion migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d verix_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261008235800_atomic_telemetry_ingest.sql

      - name: Test atomic ingestion and rollback behavior
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d verix_test -v ON_ERROR_STOP=1 -f tests/database/atomic-telemetry-ingest.integration.sql

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\\windows\\VerixPortable\\VerixPortable.csproj

      - name: Build Windows host
        run: dotnet build .\\windows\\VerixPortable\\VerixPortable.csproj -c Release --no-restore

      - name: Publish Windows host
        run: dotnet publish .\\windows\\VerixPortable\\VerixPortable.csproj -c Release -r win-x64 --self-contained true --no-restore

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verix-windows-win-x64
          path: windows/VerixPortable/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 7
