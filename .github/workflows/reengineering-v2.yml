name: VÉRIX 2 Reengineering CI

on:
  push:
    branches: ["reengineering-v2"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: V2 build
        run: npm run build:v2

      - name: Reject source maps
        shell: bash
        run: |
          if find dist-v2 -type f -name '*.map' | grep -q .; then
            echo "Source maps are not allowed in the V2 production artifact."
            exit 1
          fi
