name: Deploy VÉRIX (Secure) to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "verix-app.html"
      - "verix-presence-v1.mjs"
      - "admin_v2.html"
      - "index.html"
      - "verix-mobile.html"
      - "verix-mobile.js"
      - "verix-mobile.css"
      - "favicon.svg"
      - "site.webmanifest"
      - "admin.webmanifest"
      - "sw.js"
      - "assets/**"
      - "AI-ACCESS-POLICY.md"
      - "robots.txt"
      - "package.json"
      - "tools/build-secure-release.mjs"
      - "tools/verify-ai-security.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Verify mobile asset cache keys
        shell: bash
        run: |
          grep -qF 'verix-mobile.css?v=10' verix-app.html
          grep -qF 'verix-mobile.js?v=10' verix-app.html
          if grep -qF 'openToken' verix-app.html; then
            echo "Mobile assets must use the release ID, not a random per-open URL"
            exit 1
          fi
      - name: Build secure release
        env:
          VERIX_BUILD_ID: "1.5-sec-${{ github.run_number }}-${{ github.sha }}"
        run: npm run build:secure

      - name: Validate mobile adapter and assets
        shell: bash
        run: |
          node --check verix-mobile.js
          node --check dist/verix-mobile.js
          grep -q "verix-fresh-mobile-assets" dist/verix-app.html
          grep -q 'id="vxMobileBack"' dist/verix-mobile.js
          grep -q "Voltar ao menu anterior" dist/verix-mobile.js
          grep -q "mostrarMenuPrincipal" dist/verix-mobile.js
          grep -q "Mobile/tablet consultation stack" dist/verix-mobile.css
          grep -q "section.panel.insurance" dist/verix-mobile.css
          grep -q "section.panel.verix-livrete-panel" dist/verix-mobile.css
          grep -q "dismissKeyboardOnConsult" dist/verix-mobile.js
          grep -q ":has(#veiculoFrame:not(\\[src\\]))" dist/verix-mobile.css
          test -s dist/verix-mobile.html
          test -s dist/verix-mobile.css
          test -s dist/verix-mobile.js
          node -e "const v=JSON.parse(require('fs').readFileSync('dist/version.json','utf8')); if(typeof v.buildId!=='string'||!v.buildId) process.exit(1)"
          grep -q "version.json?_=" dist/index.html
          grep -q 'site.webmanifest?v=20261019-op3' dist/index.html
          grep -q "cache:'no-store'" dist/index.html
          grep -q "version.json?_=" dist/verix-mobile.html
          grep -q 'site.webmanifest?v=20261019-op3' dist/verix-mobile.html
          grep -q "./verix-mobile.html" dist/index.html
          grep -q "./verix-app.html" dist/verix-mobile.html

      - name: Validate realtime presence bundle
        shell: bash
        run: |
          test -s dist/verix-presence-v1.js
          node --check verix-presence-v1.mjs
          node --check dist/verix-presence-v1.js
          grep -q 'verix-presence-v1.js?v=' dist/verix-app.html
          grep -q 'verix-presence-v1.js?v=' dist/admin_v2.html

      - name: Verify secure build
        shell: bash
        run: |
          test ! -f dist/verix-app.html.map
          test ! -f dist/admin_v2.html.map
          if find dist -type f -name '*.map' | grep -q .; then
            echo "Source-map file found in dist"
            exit 1
          fi
          if grep -R -n 'sourceMappingURL\|//# sourceURL' dist; then
            echo "Source-map directive found in dist"
            exit 1
          fi
          grep -q "verix-gate-v1" dist/verix-app.html
          grep -q "X-Verix-Build-Id" dist/verix-app.html
          grep -q "X-Verix-Client-Token" dist/verix-app.html
          grep -q "verix-telemetry-v2" dist/verix-app.html
          grep -q 'name="verix-ai-policy"' dist/verix-app.html
          grep -q 'name="verix-ai-policy"' dist/admin_v2.html
          test -s dist/AI-ACCESS-POLICY.md
          test -s dist/robots.txt

      - name: Validate HTML structure
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Validator(HTMLParser):
              VOID = {
                  'area','base','br','col','embed','hr','img','input',
                  'link','meta','param','source','track','wbr'
              }
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag not in self.VOID:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  pass

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if not self.stack or self.stack[-1] != tag:
                      self.errors.append(
                          f"unexpected closing </{tag}> at {self.getpos()}"
                      )
                  else:
                      self.stack.pop()

          for path in (Path("dist/verix-app.html"), Path("dist/admin_v2.html")):
              if not path.is_file():
                  raise SystemExit(f"Required published HTML file missing: {path}")
              parser = Validator()
              parser.feed(path.read_text(encoding="utf-8"))

              if parser.errors:
                  raise SystemExit(f"{path}:\n" + "\n".join(parser.errors[:20]))
              if parser.stack:
                  raise SystemExit(f"{path}: unclosed HTML tags: {parser.stack[-20:]}")
              print(f"HTML structural validation: OK — {path}")
          PY

      - name: Ensure .nojekyll in dist
        run: touch dist/.nojekyll

      - name: Verify VÉRIX brand assets
        shell: bash
        run: |
          test -s dist/favicon.svg
          test -s dist/site.webmanifest
          node -e "const fs=require('fs'); const o=JSON.parse(fs.readFileSync('dist/site.webmanifest')); const a=JSON.parse(fs.readFileSync('dist/admin.webmanifest')); if(o.id!=='/verix/operational-v4/'||a.id!=='/verix/admin/'||o.id===a.id) process.exit(1); if(o.scope!=='./'||a.scope!=='./admin/') process.exit(1)"
          test -s dist/admin.webmanifest
          grep -Fq 'rel="manifest" href="./manifest.webmanifest?v=20261019-admin5"' dist/admin/index.html
          grep -q '"start_url": "./admin/index.html?app=verix-admin-v5"' dist/admin.webmanifest
          grep -q '"scope": "./admin/"' dist/admin.webmanifest
          test -s dist/admin/index.html
          test -s dist/admin/manifest.webmanifest
          test -s dist/admin/assets/admin-icon-192.png
          test -s dist/admin/assets/admin-icon-512.png
          test -s dist/admin/assets/admin-icon.svg
          test -s dist/admin/assets/icon-32.png
          test -s dist/admin/verix-presence-v1.js
          test -s dist/admin/AI-ACCESS-POLICY.md
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('dist/admin/manifest.webmanifest')); if(a.id!=='/verix/admin/'||a.start_url!=='./index.html?app=verix-admin-v5'||a.scope!=='./') process.exit(1)"
          test -s dist/admin/sw.js
          node --check dist/admin/sw.js
          grep -q "isAdminManifest" dist/sw.js
          test -s dist/sw.js
          node --check dist/sw.js
          grep -q "request.mode === 'navigate'" dist/sw.js
          grep -q "cache: 'no-store'" dist/sw.js
          grep -q "navigator.serviceWorker.register('./sw.js'" dist/index.html
          grep -q "navigator.serviceWorker.register('./sw.js'" dist/verix-mobile.html
          grep -q "updateViaCache: 'none'" dist/index.html
          grep -q "updateViaCache: 'none'" dist/verix-mobile.html
          test -s dist/assets/verix-emblem.svg
          test -s dist/assets/icon-32.png
          test -s dist/assets/icon-192.png
          test -s dist/assets/icon-512.png
          test -s dist/assets/admin-icon.svg
          test -s dist/assets/admin-icon-192.png
          test -s dist/assets/admin-icon-512.png
          grep -q "admin-icon-192.png" dist/admin.webmanifest
          grep -q "admin-icon-512.png" dist/admin.webmanifest
          grep -q '"sizes": "512x512"' dist/site.webmanifest
          grep -q 'rel="manifest"' dist/verix-app.html
          grep -q 'rel="icon"' dist/verix-app.html
          grep -q 'verix-emblem.svg' dist/verix-app.html

      - name: Validate GitHub Pages Admin PWA
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('dist/admin/index.html', 'utf8');
          const sourceHtml = fs.readFileSync('admin_v2.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('dist/admin/manifest.webmanifest', 'utf8'));
          const operational = JSON.parse(fs.readFileSync('dist/site.webmanifest', 'utf8'));
          const rootAdminManifest = JSON.parse(fs.readFileSync('dist/admin.webmanifest', 'utf8'));
          if (!html.includes('rel="manifest" href="./manifest.webmanifest?v=20261019-admin5"')) throw new Error('GitHub Pages /admin/ entry must link its own install manifest');
          if (manifest.id !== '/verix/admin/' || manifest.start_url !== './index.html?app=verix-admin-v5' || manifest.scope !== './' || manifest.display !== 'standalone') throw new Error('GitHub Admin manifest identity, start URL, scope or display is invalid');
          if (rootAdminManifest.id !== manifest.id || rootAdminManifest.start_url !== './admin/index.html?app=verix-admin-v5' || rootAdminManifest.scope !== './admin/') throw new Error('Root Admin manifest must retain the same distinct identity with the narrower Admin scope');
          if (manifest.id === operational.id || manifest.start_url === operational.start_url) throw new Error('Admin and Operational app identities/launch URLs must differ');
          if (!html.includes('id="installAdminApp"') || !html.includes('beforeinstallprompt')) throw new Error('Admin install control/event is missing');
          if (html.includes('id="installAdminLogin"')) throw new Error('Install button must not appear on the pre-login screen');
          if (html.indexOf('id="installAdminApp"') < html.indexOf('<div id="app"')) throw new Error('Install button must be inside the authenticated application');
          if (!sourceHtml.includes("new URL('./admin/'") || !sourceHtml.includes('window.location.replace(destination.toString())')) throw new Error('Legacy Admin entry must route to GitHub Pages /admin/');
          if (sourceHtml.includes('https://onilkakbgpklxvxuxmks.supabase.co/functions/v1/verix-admin-pwa')) throw new Error('Admin UI must not be routed through the Supabase HTML proxy');
          if (!sourceHtml.includes('isAdminScopedPath') || !sourceHtml.includes('VERIX_ADMIN_PWA_INSTALLED_V5')) throw new Error('Admin install guard/flag must use the dedicated /admin/ scope');
          if (!html.includes('../verix-presence-v1.js') || !fs.existsSync('dist/admin/verix-presence-v1.js')) throw new Error('Admin realtime presence bundle is missing');
          for (const file of ['dist/admin/manifest.webmanifest','dist/admin/sw.js','dist/admin/AI-ACCESS-POLICY.md','dist/admin/assets/admin-icon-192.png','dist/admin/assets/admin-icon-512.png','dist/assets/admin-icon-192.png','dist/assets/admin-icon-512.png']) {
            if (!fs.existsSync(file)) throw new Error('Admin PWA asset missing: ' + file);
          }
          if (!(manifest.icons || []).some(x => x.src.includes('admin-icon-192.png')) || !(manifest.icons || []).some(x => x.src.includes('admin-icon-512.png'))) throw new Error('Admin manifest must use its own 192px/512px icons');
          console.log('GitHub Pages Admin PWA: separate app ID, scoped manifest, install button and assets OK');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Smoke-test GitHub Pages Admin PWA
        shell: bash
        run: |
          set -euo pipefail
          PAGES_BASE="${{ steps.deployment.outputs.page_url }}"
          PAGES_BASE="${PAGES_BASE%/}/"
          PAGES_ORIGIN="$(node -e 'console.log(new URL(process.argv[1]).origin)' "$PAGES_BASE")"

          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -D /tmp/verix-admin-headers.txt "${PAGES_BASE}admin/index.html?ci=verix-admin-v5" -o /tmp/verix-admin.html
          grep -Fqi 'content-type: text/html' /tmp/verix-admin-headers.txt
          grep -Fq 'rel="manifest" href="./manifest.webmanifest?v=20261019-admin5"' /tmp/verix-admin.html
          grep -Fq 'id="installAdminApp"' /tmp/verix-admin.html

          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "${PAGES_BASE}admin/manifest.webmanifest?v=20261019-admin5" -o /tmp/verix-admin-manifest.json
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "${PAGES_BASE}site.webmanifest" -o /tmp/verix-operational-manifest.json
          node - <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('/tmp/verix-admin-manifest.json', 'utf8'));
          const o = JSON.parse(fs.readFileSync('/tmp/verix-operational-manifest.json', 'utf8'));
          if (a.id !== '/verix/admin/' || a.start_url !== './index.html?app=verix-admin-v5' || a.scope !== './') throw new Error('Live GitHub Admin manifest identity/start_url/scope invalid');
          if (o.id !== '/verix/operational-v4/' || o.id === a.id) throw new Error('Operational PWA identity must remain unchanged and distinct from Admin');
          if (!Array.isArray(a.icons) || !a.icons.some(x => x.src.includes('admin-icon-192.png')) || !a.icons.some(x => x.src.includes('admin-icon-512.png'))) throw new Error('Admin manifest icons missing');
          NODE

          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "${PAGES_BASE}admin/sw.js" -o /tmp/verix-admin-sw.js
          node --check /tmp/verix-admin-sw.js

          for asset in assets/admin-icon-192.png assets/admin-icon-512.png verix-presence-v1.js; do
            curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 "${PAGES_BASE}${asset}" -o /dev/null
          done

          # All Admin APIs must permit the GitHub Pages origin.
          for endpoint in admin-auth-v2 stats-v2 telemetry-v2; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 20 -X OPTIONS \
              -H "Origin: ${PAGES_ORIGIN}" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type" \
              -D /tmp/verix-admin-cors.txt -o /dev/null \
              "https://onilkakbgpklxvxuxmks.supabase.co/functions/v1/${endpoint}"
            grep -Fqi "access-control-allow-origin: ${PAGES_ORIGIN}" /tmp/verix-admin-cors.txt
          done

          # Admin telemetry v3 accepts GET and validates its own short-lived signed token.
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 20 -X OPTIONS \
            -H "Origin: ${PAGES_ORIGIN}" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            -D /tmp/verix-admin-telemetry-cors.txt -o /dev/null \
            "https://onilkakbgpklxvxuxmks.supabase.co/functions/v1/admin-telemetry-v3?view=dashboard"
          grep -Fqi "access-control-allow-origin: ${PAGES_ORIGIN}" /tmp/verix-admin-telemetry-cors.txt
          grep -Eqi '^access-control-allow-methods:.*GET' /tmp/verix-admin-telemetry-cors.txt
          grep -Eqi '^access-control-allow-headers:.*authorization' /tmp/verix-admin-telemetry-cors.txt

          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "${PAGES_BASE}admin_v2.html?ci=verix-admin-entry-v5" -o /tmp/verix-admin-entry.html
          grep -Fq 'VÉRIX — Administração' /tmp/verix-admin-entry.html
          echo "GitHub Pages Admin PWA, HTML MIME type, separate install ID, assets and backend CORS: OK"
