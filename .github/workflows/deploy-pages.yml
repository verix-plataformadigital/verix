name: Deploy VÉRIX (Secure) to verix-site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "verix-site-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build secure release
        env:
          VERIX_BUILD_ID: "1.5-sec-${{ github.run_number }}-${{ github.sha }}"
        run: npm run build:secure

      - name: Ensure .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy to verix-site
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.VERIX_DEPLOY_TOKEN }}
          external_repository: verix-plataformadigital/verix-site
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
          user_name: "verix-deploy"
          user_email: "verix.plataformadigital@gmail.com"
          commit_message: "deploy: VÉRIX secure build ${{ github.run_number }}"
