name: Deploy VÉRIX (Secure) to GitHub Pages

on:
  push:
    branches: ["main"]
    # Server-only changes must not rebuild/reissue the portable client.
    # Publish Pages only when an actual static application/Admin asset changes.
    paths:
      - "index.html"
      - "verix-app.html"
      - "verix-mobile*"
      - "verix-depth-ui.css"
      - "verix-mobile-final.css"
      - "admin_v2.html"
      - "admin/**"
      - "assets/**"
      - "verix-presence-v1.js"
      - "AI-ACCESS-POLICY.md"
      - "tools/build-secure-release.mjs"
      - "package.json"
      - "package-lock.json"
      - "deployment/public-pages-workflow.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build secure release
        env:
          VERIX_BUILD_ID: "1.5-sec-${{ github.run_number }}-${{ github.sha }}"
        run: npm run build:secure

      - name: Verify secure build
        shell: bash
        run: |
          test ! -f dist/verix-app.html.map
          test ! -f dist/admin_v2.html.map
          if find dist -type f -name '*.map' | grep -q .; then
            echo "Source-map file found in dist"
            exit 1
          fi
          if grep -R -n 'sourceMappingURL\|//# sourceURL' dist; then
            echo "Source-map directive found in dist"
            exit 1
          fi
          grep -q "verix-gate-v1" dist/verix-app.html
          grep -q "X-Verix-Build-Id" dist/verix-app.html
          grep -q "X-Verix-Client-Token" dist/verix-app.html
          grep -q "verix-telemetry-v2" dist/verix-app.html
          test -s dist/admin/index.html
          test -s dist/admin/manifest.webmanifest
          test -s dist/admin/sw.js
          test -s dist/verix-presence-v1.js
          grep -q 'verix-presence-v1.js' dist/verix-app.html
          test -s dist/assets/admin-icon.svg
          test -s dist/AI-ACCESS-POLICY.md
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('dist/admin/index.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('dist/admin/manifest.webmanifest', 'utf8'));
          if (manifest.id !== '/verix/admin/' || manifest.start_url !== './index.html?app=verix-admin-v5' || manifest.scope !== './') {
            throw new Error('Admin V3 manifest identity/start URL/scope is invalid');
          }
          if (!html.includes('./manifest.webmanifest?v=') || !html.includes('../verix-presence-v1.js')) {
            throw new Error('Admin V3 runtime or manifest link is missing');
          }
          NODE

      - name: Validate HTML structure
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Validator(HTMLParser):
              VOID = {
                  'area','base','br','col','embed','hr','img','input',
                  'link','meta','param','source','track','wbr'
              }
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag not in self.VOID:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  pass

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if not self.stack or self.stack[-1] != tag:
                      self.errors.append(
                          f"unexpected closing </{tag}> at {self.getpos()}"
                      )
                  else:
                      self.stack.pop()

          for path in (Path("dist/verix-app.html"), Path("dist/admin_v2.html"), Path("dist/admin/index.html")):
              if not path.is_file():
                  raise SystemExit(f"Required published HTML file missing: {path}")
              parser = Validator()
              parser.feed(path.read_text(encoding="utf-8"))

              if parser.errors:
                  raise SystemExit(f"{path}:\n" + "\n".join(parser.errors[:20]))
              if parser.stack:
                  raise SystemExit(f"{path}: unclosed HTML tags: {parser.stack[-20:]}")
              print(f"HTML structural validation: OK — {path}")
          PY

      - name: Ensure .nojekyll in dist
        run: touch dist/.nojekyll

      - name: Require cross-repository publishing token
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          PAGES_TOKEN: ${{ secrets.VERIX_PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error::Missing VERIX_PAGES_TOKEN. Add a fine-grained token with Contents: Read and write access to the public deployment repository."
            exit 1
          fi

      - name: Checkout public Pages repository
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: verix-plataformadigital/verix-plataformadigital.github.io
          ref: main
          token: ${{ secrets.VERIX_PAGES_TOKEN }}
          path: public-pages
          persist-credentials: true

      - name: Sync only the generated site to the public repository
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-pages/verix public-pages/.github/workflows
          find public-pages/verix -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a dist/. public-pages/verix/
          cp deployment/public-pages-workflow.yml public-pages/.github/workflows/pages.yml
          touch public-pages/verix/.nojekyll
          git -C public-pages config user.name "github-actions[bot]"
          git -C public-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public-pages add --all -- verix .github/workflows/pages.yml
          if git -C public-pages diff --cached --quiet; then
            echo "Public site is already synchronized."
            exit 0
          fi
          git -C public-pages commit -m "deploy: publish VÉRIX build $SOURCE_RUN ($SOURCE_SHA)"
          git -C public-pages push origin HEAD:main
