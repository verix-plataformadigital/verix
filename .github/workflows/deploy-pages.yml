name: Deploy VÉRIX (Secure) to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "verix-app.html"
      - "verix-presence-v1.mjs"
      - "admin_v2.html"
      - "index.html"
      - "verix-mobile.html"
      - "verix-mobile.js"
      - "verix-mobile.css"
      - "favicon.svg"
      - "site.webmanifest"
      - "admin.webmanifest"
      - "sw.js"
      - "assets/**"
      - "AI-ACCESS-POLICY.md"
      - "robots.txt"
      - "package.json"
      - "tools/build-secure-release.mjs"
      - "tools/verify-ai-security.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Verify mobile asset cache keys
        shell: bash
        run: |
          grep -qF 'verix-mobile.css?v=10' verix-app.html
          grep -qF 'verix-mobile.js?v=10' verix-app.html
          if grep -qF 'openToken' verix-app.html; then
            echo "Mobile assets must use the release ID, not a random per-open URL"
            exit 1
          fi
      - name: Build secure release
        env:
          VERIX_BUILD_ID: "1.5-sec-${{ github.run_number }}-${{ github.sha }}"
        run: npm run build:secure

      - name: Validate mobile adapter and assets
        shell: bash
        run: |
          node --check verix-mobile.js
          node --check dist/verix-mobile.js
          grep -q "verix-fresh-mobile-assets" dist/verix-app.html
          grep -q 'id="vxMobileBack"' dist/verix-mobile.js
          grep -q "Voltar ao menu anterior" dist/verix-mobile.js
          grep -q "mostrarMenuPrincipal" dist/verix-mobile.js
          grep -q "Mobile/tablet consultation stack" dist/verix-mobile.css
          grep -q "section.panel.insurance" dist/verix-mobile.css
          grep -q "section.panel.verix-livrete-panel" dist/verix-mobile.css
          grep -q "dismissKeyboardOnConsult" dist/verix-mobile.js
          grep -q ":has(#veiculoFrame:not(\\[src\\]))" dist/verix-mobile.css
          test -s dist/verix-mobile.html
          test -s dist/verix-mobile.css
          test -s dist/verix-mobile.js
          node -e "const v=JSON.parse(require('fs').readFileSync('dist/version.json','utf8')); if(typeof v.buildId!=='string'||!v.buildId) process.exit(1)"
          grep -q "version.json?_=" dist/index.html
          grep -q 'site.webmanifest?v=20261019-op3' dist/index.html
          grep -q "cache:'no-store'" dist/index.html
          grep -q "version.json?_=" dist/verix-mobile.html
          grep -q 'site.webmanifest?v=20261019-op3' dist/verix-mobile.html
          grep -q "./verix-mobile.html" dist/index.html
          grep -q "./verix-app.html" dist/verix-mobile.html

      - name: Validate realtime presence bundle
        shell: bash
        run: |
          test -s dist/verix-presence-v1.js
          node --check verix-presence-v1.mjs
          node --check dist/verix-presence-v1.js
          grep -q 'verix-presence-v1.js?v=' dist/verix-app.html
          grep -q 'verix-presence-v1.js?v=' dist/admin_v2.html

      - name: Verify secure build
        shell: bash
        run: |
          test ! -f dist/verix-app.html.map
          test ! -f dist/admin_v2.html.map
          if find dist -type f -name '*.map' | grep -q .; then
            echo "Source-map file found in dist"
            exit 1
          fi
          if grep -R -n 'sourceMappingURL\|//# sourceURL' dist; then
            echo "Source-map directive found in dist"
            exit 1
          fi
          grep -q "verix-gate-v1" dist/verix-app.html
          grep -q "X-Verix-Build-Id" dist/verix-app.html
          grep -q "X-Verix-Client-Token" dist/verix-app.html
          grep -q "verix-telemetry-v2" dist/verix-app.html
          grep -q 'name="verix-ai-policy"' dist/verix-app.html
          grep -q 'name="verix-ai-policy"' dist/admin_v2.html
          test -s dist/AI-ACCESS-POLICY.md
          test -s dist/robots.txt

      - name: Validate HTML structure
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Validator(HTMLParser):
              VOID = {
                  'area','base','br','col','embed','hr','img','input',
                  'link','meta','param','source','track','wbr'
              }
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag not in self.VOID:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  pass

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if not self.stack or self.stack[-1] != tag:
                      self.errors.append(
                          f"unexpected closing </{tag}> at {self.getpos()}"
                      )
                  else:
                      self.stack.pop()

          for path in (Path("dist/verix-app.html"), Path("dist/admin_v2.html")):
              if not path.is_file():
                  raise SystemExit(f"Required published HTML file missing: {path}")
              parser = Validator()
              parser.feed(path.read_text(encoding="utf-8"))

              if parser.errors:
                  raise SystemExit(f"{path}:\n" + "\n".join(parser.errors[:20]))
              if parser.stack:
                  raise SystemExit(f"{path}: unclosed HTML tags: {parser.stack[-20:]}")
              print(f"HTML structural validation: OK — {path}")
          PY

      - name: Ensure .nojekyll in dist
        run: touch dist/.nojekyll

      - name: Verify VÉRIX brand assets
        shell: bash
        run: |
          test -s dist/favicon.svg
          test -s dist/site.webmanifest
          node -e "const fs=require('fs'); const o=JSON.parse(fs.readFileSync('dist/site.webmanifest')); const a=JSON.parse(fs.readFileSync('dist/admin.webmanifest')); if(o.id!=='/verix/operational-v4/'||a.id!=='/verix/admin-v4/'||o.id===a.id) process.exit(1); if(o.scope!=='./'||a.scope!=='./admin/') process.exit(1)"
          test -s dist/admin.webmanifest
          if grep -q 'rel="manifest" href="./manifest.webmanifest?v=20261019-admin4"' dist/admin/index.html; then
            echo "GitHub Pages must not expose the Admin as an installable PWA on the Operational origin"
            exit 1
          fi
          grep -q '"start_url": "./admin/index.html?app=verix-admin-v4"' dist/admin.webmanifest
          grep -q '"scope": "./admin/"' dist/admin.webmanifest
          test -s dist/admin/index.html
          test -s dist/admin/manifest.webmanifest
          test -s dist/admin/assets/admin-icon-192.png
          test -s dist/admin/assets/admin-icon-512.png
          test -s dist/admin/assets/admin-icon.svg
          test -s dist/admin/assets/icon-32.png
          test -s dist/admin/verix-presence-v1.js
          test -s dist/admin/AI-ACCESS-POLICY.md
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('dist/admin/manifest.webmanifest')); if(a.id!=='/verix/admin-v4/'||a.start_url!=='./index.html?app=verix-admin-v4'||a.scope!=='./') process.exit(1)"
          test -s dist/admin/sw.js
          node --check dist/admin/sw.js
          grep -q "isAdminManifest" dist/sw.js
          test -s dist/sw.js
          node --check dist/sw.js
          grep -q "request.mode === 'navigate'" dist/sw.js
          grep -q "cache: 'no-store'" dist/sw.js
          grep -q "navigator.serviceWorker.register('./sw.js'" dist/index.html
          grep -q "navigator.serviceWorker.register('./sw.js'" dist/verix-mobile.html
          grep -q "updateViaCache: 'none'" dist/index.html
          grep -q "updateViaCache: 'none'" dist/verix-mobile.html
          test -s dist/assets/verix-emblem.svg
          test -s dist/assets/icon-32.png
          test -s dist/assets/icon-192.png
          test -s dist/assets/icon-512.png
          test -s dist/assets/admin-icon.svg
          test -s dist/assets/admin-icon-192.png
          test -s dist/assets/admin-icon-512.png
          grep -q "admin-icon-192.png" dist/admin.webmanifest
          grep -q "admin-icon-512.png" dist/admin.webmanifest
          grep -q '"sizes": "512x512"' dist/site.webmanifest
          grep -q 'rel="manifest"' dist/verix-app.html
          grep -q 'rel="icon"' dist/verix-app.html
          grep -q 'verix-emblem.svg' dist/verix-app.html

      - name: Validate dedicated-origin Admin build
        shell: bash
        run: |
          VERIX_ADMIN_PWA_HOST=1 VERIX_OUTPUT_DIR=dist-vercel npm run build:secure
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('dist-vercel/admin/manifest.webmanifest', 'utf8'));
          const html = fs.readFileSync('dist-vercel/admin/index.html', 'utf8');
          if (!html.includes('rel="manifest" href="./manifest.webmanifest?v=20261019-admin4"')) throw new Error('Dedicated-origin Admin build must link its own installable manifest');
          if (manifest.id !== '/verix/admin-v4/' || manifest.start_url !== './index.html?app=verix-admin-v4' || manifest.scope !== './') throw new Error('Dedicated-origin Admin manifest identity or scope is invalid');
          for (const file of ['dist-vercel/admin/assets/admin-icon-192.png','dist-vercel/admin/assets/admin-icon-512.png','dist-vercel/admin/verix-presence-v1.js','dist-vercel/admin/AI-ACCESS-POLICY.md','dist-vercel/admin/sw.js']) {
            if (!fs.existsSync(file)) throw new Error('Dedicated-origin Admin output is incomplete: ' + file);
          }
          console.log('Dedicated-origin Admin build: manifest, identity, runtime and assets OK');
          NODE
          node - <<'NODE'
          const fs = require('node:fs');
          const source = 'dist-vercel/admin';
          const dest = 'dist/admin-proxy';
          fs.cpSync(source, dest, { recursive: true, force: true });
          const htmlPath = dest + '/index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');
          html = html.replace(/<link\b[^>]*\brel=["']manifest["'][^>]*>\s*/gi, '');
          if (/<link\b[^>]*\brel=["']manifest["']/i.test(html)) throw new Error('Admin proxy source must not advertise a PWA manifest on GitHub Pages');
          fs.writeFileSync(htmlPath, html, 'utf8');
          for (const file of ['index.html','manifest.webmanifest','sw.js','verix-presence-v1.js','AI-ACCESS-POLICY.md','assets/admin-icon-192.png','assets/admin-icon-512.png']) {
            if (!fs.existsSync(dest + '/' + file)) throw new Error('Admin proxy asset missing: ' + file);
          }
          console.log('Copied standalone Admin runtime to non-installable GitHub Pages source for same-origin proxy');
          NODE

      - name: Validate separately scoped Admin PWA
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('dist/admin.webmanifest', 'utf8'));
          const vercelConfig = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (vercelConfig.buildCommand !== 'VERIX_ADMIN_PWA_HOST=1 npm run build:secure' || vercelConfig.outputDirectory !== 'dist/admin') throw new Error('Vercel must publish only the self-contained Admin bundle on its own origin');
          const nestedManifest = JSON.parse(fs.readFileSync('dist/admin/manifest.webmanifest', 'utf8'));
          if (manifest.id !== '/verix/admin-v4/' ||
              manifest.start_url !== './admin/index.html?app=verix-admin-v4' ||
              manifest.scope !== './admin/' ||
              manifest.display !== 'standalone') {
            throw new Error('Admin PWA must have its own install identity and narrower /admin/ scope');
          }
          if (nestedManifest.id !== '/verix/admin-v4/' || nestedManifest.start_url !== './index.html?app=verix-admin-v4' || nestedManifest.scope !== './') throw new Error('Admin-scoped manifest must use Admin-only identity, start URL and scope');
          const html = fs.readFileSync('dist/admin/index.html', 'utf8');
          const rootAdmin = fs.readFileSync('dist/admin_v2.html', 'utf8');
          const sourceHtml = fs.readFileSync('admin_v2.html', 'utf8');
          const proxyHtml = fs.readFileSync('dist/admin-proxy/index.html', 'utf8');
          const edgeProxy = fs.readFileSync('supabase/functions/verix-admin-pwa/index.ts', 'utf8');
          if (proxyHtml.includes('rel="manifest" href="./manifest.webmanifest')) throw new Error('GitHub Pages proxy source must not advertise the Admin PWA manifest');
          if (!proxyHtml.includes('id="installAdminApp"') || !proxyHtml.includes('beforeinstallprompt')) throw new Error('Standalone Admin source bundle is incomplete');
          if (!edgeProxy.includes('UPSTREAM_ROOT') || !edgeProxy.includes('rewriteManifest') || !edgeProxy.includes('verix-admin-pwa')) throw new Error('Supabase Admin origin proxy source is missing or incomplete');
          for (const file of ['dist/admin-proxy/manifest.webmanifest','dist/admin-proxy/sw.js','dist/admin-proxy/verix-presence-v1.js','dist/admin-proxy/AI-ACCESS-POLICY.md','dist/admin-proxy/assets/admin-icon-192.png','dist/admin-proxy/assets/admin-icon-512.png']) {
            if (!fs.existsSync(file)) throw new Error('Supabase Admin proxy source file missing: ' + file);
          }
          for (const required of [
            'id="installAdminApp"',
            'beforeinstallprompt',
            '../verix-presence-v1.js'
          ]) {
            if (!html.includes(required)) throw new Error('Admin page element missing: ' + required);
          }
          if (html.includes('rel="manifest" href="./manifest.webmanifest?v=20261019-admin4"')) throw new Error('GitHub Pages must not link an installable Admin manifest on the shared Operational origin');
          if (!sourceHtml.includes('isSharedGithubPagesOrigin') || !sourceHtml.includes('Instalação do Admin desativada neste domínio partilhado')) throw new Error('Admin install button must be blocked on the shared GitHub Pages origin');
          if (html.includes('id="installAdminLogin"')) throw new Error('Install button must not appear on the pre-login screen');
          const appStart = html.indexOf('<div id="app"');
          const installPos = html.indexOf('id="installAdminApp"');
          if (appStart < 0 || installPos < appStart) throw new Error('Install button must be inside the authenticated Admin application');
          if (rootAdmin.includes('rel="manifest" href="./admin.webmanifest')) throw new Error('Root admin page must not claim the installable admin manifest');
          if (!sourceHtml.includes('functions/v1/verix-admin-pwa/index.html')) throw new Error('GitHub Pages Admin source must route to the independent Supabase origin');
          if (!sourceHtml.includes('Adicionar ao ecrã principal')) {
            throw new Error('Install fallback instructions missing from Admin source');
          }
          if (!manifest.icons.some(icon => icon.src.includes('admin-icon-192.png')) || !manifest.icons.some(icon => icon.src.includes('admin-icon-512.png'))) throw new Error('Admin manifest must use distinct raster icons at 192px and 512px');
          for (const icon of nestedManifest.icons || []) {
            const githubPagesPath = path.join('dist/admin', icon.src.split('?')[0]);
            const standalonePath = path.join('dist/admin', icon.src.split('?')[0].replace(/^\.\.\//, ''));
            if (!fs.existsSync(githubPagesPath) || !fs.existsSync(standalonePath)) throw new Error('Admin PWA icon must exist for both GitHub Pages and separate-origin hosting: ' + icon.src);
          }
          const adminBundle = fs.readFileSync('dist/admin/index.html', 'utf8');
          for (const asset of ['../assets/', '../verix-presence-v1.js', '../AI-ACCESS-POLICY.md']) {
            if (adminBundle.includes(asset) && asset === '../assets/' && !fs.existsSync('dist/admin/assets')) throw new Error('Admin asset directory is not self-contained');
          }
          for (const icon of manifest.icons || []) {
            const iconPath = path.join('dist', icon.src.split('?')[0]);
            if (!fs.existsSync(iconPath)) throw new Error('Admin PWA icon missing: ' + iconPath);
          }
          if (!fs.existsSync('dist/admin/sw.js')) throw new Error('Dedicated Admin worker is missing');
          const adminPresence = fs.readFileSync('dist/admin/index.html', 'utf8');
          if (!adminPresence.includes('../verix-presence-v1.js') || !fs.existsSync('dist/admin/verix-presence-v1.js')) throw new Error('Admin presence runtime must be bundled for separate-origin hosting');
          if (!fs.existsSync('vercel.json')) throw new Error('Separate-origin Vercel deployment configuration is missing');
          console.log('Admin proxy source, separate-origin routing, authenticated install and self-contained assets: OK');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Smoke-test isolated Admin origin
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://onilkakbgpklxvxuxmks.supabase.co/functions/v1/verix-admin-pwa"
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$BASE/index.html" -o /tmp/verix-admin.html
          grep -Fq '<link rel="manifest" href="./manifest.webmanifest?v=verix-admin-origin-1">' /tmp/verix-admin.html
          grep -Fq 'id="installAdminApp"' /tmp/verix-admin.html
          if grep -Fq 'rel="manifest" href="./manifest.webmanifest?v=20261019-admin4"' /tmp/verix-admin.html; then
            echo "Admin is still linking to the shared-origin manifest"
            exit 1
          fi
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$BASE/manifest.webmanifest?v=verix-admin-origin-1" -o /tmp/verix-admin-manifest.json
          node - <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('/tmp/verix-admin-manifest.json', 'utf8'));
          if (m.id !== '/functions/v1/verix-admin-pwa/' ||
              m.start_url !== './index.html?app=verix-admin-edge-v1' ||
              m.scope !== './') throw new Error('Live Admin manifest identity/start URL/scope is invalid');
          if (!Array.isArray(m.icons) || !m.icons.some(x => x.src === './assets/admin-icon-192.png?v=20261019-admin4') ||
              !m.icons.some(x => x.src === './assets/admin-icon-512.png?v=20261019-admin4')) {
            throw new Error('Live Admin manifest does not expose its separate install icons');
          }
          NODE
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$BASE/sw.js" -o /tmp/verix-admin-sw.js
          node --check /tmp/verix-admin-sw.js
          for asset in assets/admin-icon-192.png assets/admin-icon-512.png verix-presence-v1.js AI-ACCESS-POLICY.md; do
            curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$BASE/$asset" -o /dev/null
          done
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 20 -X OPTIONS \
            -H "Origin: https://onilkakbgpklxvxuxmks.supabase.co" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            -D /tmp/verix-admin-auth-cors.txt -o /dev/null \
            "https://onilkakbgpklxvxuxmks.supabase.co/functions/v1/admin-auth-v2"
          grep -Fqi 'access-control-allow-origin: https://onilkakbgpklxvxuxmks.supabase.co' /tmp/verix-admin-auth-cors.txt
          echo "Isolated Admin page, manifest, service worker, icons, runtime assets and auth CORS: OK"
