name: Deploy VÉRIX (Secure) to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use pinned npm resolver
        run: npm install --global npm@12.2.0

      - name: Verify committed lockfile
        shell: bash
        run: |
          test -s package-lock.json || {
            echo "package-lock.json must be versioned; release builds cannot resolve dependencies dynamically."
            exit 1
          }
          node -e "const p=require('./package-lock.json'); if(p.name!=='verix-release-security'||p.lockfileVersion!==3) process.exit(1)"

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build secure release
        env:
          VERIX_BUILD_ID: "1.5-sec-${{ github.run_number }}-${{ github.sha }}"
        run: npm run build:secure

      - name: Verify secure build
        shell: bash
        run: |
          test ! -f dist/verix-app.html.map
          test ! -f dist/admin_v2.html.map
          if find dist -type f -name '*.map' | grep -q .; then
            echo "Source-map file found in dist"
            exit 1
          fi
          if grep -R -n 'sourceMappingURL\|//# sourceURL' dist; then
            echo "Source-map directive found in dist"
            exit 1
          fi
          grep -q "verix-gate-v1" dist/verix-app.html
          grep -q "X-Verix-Build-Id" dist/verix-app.html
          grep -q "X-Verix-Client-Token" dist/verix-app.html
          grep -q "verix-telemetry-v2" dist/verix-app.html

      - name: Validate HTML structure
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Validator(HTMLParser):
              VOID = {
                  'area','base','br','col','embed','hr','img','input',
                  'link','meta','param','source','track','wbr'
              }
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag not in self.VOID:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  pass

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if not self.stack or self.stack[-1] != tag:
                      self.errors.append(
                          f"unexpected closing </{tag}> at {self.getpos()}"
                      )
                  else:
                      self.stack.pop()

          path = Path("dist/verix-app.html")
          parser = Validator()
          parser.feed(path.read_text(encoding="utf-8"))

          if parser.errors:
              raise SystemExit("\n".join(parser.errors[:20]))
          if parser.stack:
              raise SystemExit(f"Unclosed HTML tags: {parser.stack[-20:]}")
          print("HTML structural validation: OK")
          PY

      - name: Ensure .nojekyll in dist
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    # workflow_dispatch can be started from any branch. Never let a PR branch publish to production Pages.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
