name: VÉRIX Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "verix-v*"

permissions:
  contents: read

jobs:
  validate-v2:
    name: Validate V2 quality, database and portable Windows package
    uses: ./.github/workflows/reengineering-v2.yml
    permissions:
      contents: read
      actions: read

  validate-responsive:
    name: Validate phone, tablet and desktop browsers
    uses: ./.github/workflows/mobile-responsive.yml
    permissions:
      contents: read

  release:
    name: Publish verified Windows release
    if: startsWith(github.ref, 'refs/tags/verix-v')
    needs:
      - validate-v2
      - validate-responsive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified Windows release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verix-windows-win-x64
          path: release-assets

      - name: Verify release ZIP and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          zip="release-assets/VERIX-Windows-x64.zip"
          checksum="release-assets/VERIX-Windows-x64.zip.sha256"
          test -s "$zip"
          test -s "$checksum"
          (cd release-assets && sha256sum --check VERIX-Windows-x64.zip.sha256)

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          zip="release-assets/VERIX-Windows-x64.zip"
          checksum="release-assets/VERIX-Windows-x64.zip.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" "$checksum" --clobber
          else
            args=(--title "VÉRIX Windows ${tag#verix-v}" --generate-notes --verify-tag)
            if [[ "$tag" =~ -(alpha|beta|rc)([.-]|$) ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" "$zip" "$checksum" "${args[@]}"
          fi
