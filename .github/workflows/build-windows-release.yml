name: VÉRIX Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "verix-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use pinned npm resolver
        run: npm install --global npm@12.2.0

      - name: Verify committed lockfile
        shell: pwsh
        run: |
          if (!(Test-Path package-lock.json) -or (Get-Item package-lock.json).Length -eq 0) {
            throw "package-lock.json must be committed before building the Windows release."
          }
          node -e "const p=require('./package-lock.json'); if(p.name!=='verix-release-security'||p.lockfileVersion!==3) process.exit(1)"

      - name: Install V2 dependencies
        run: npm ci --no-fund --no-audit

      - name: Build V2 local assets
        run: npm run build:v2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore windows/VerixPortable/VerixPortable.csproj

      - name: Publish portable host
        run: dotnet publish windows/VerixPortable/VerixPortable.csproj -c Release -r win-x64 --self-contained true --no-restore /p:PublishSingleFile=true

      - name: Verify V2-inclusive portable package
        run: node tools/verify-portable-package.mjs "windows/VerixPortable/bin/Release/net10.0-windows/win-x64/publish"

      - name: Create downloadable ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "windows/VerixPortable/bin/Release/net10.0-windows/win-x64/publish"
          $releaseDir = Join-Path $PWD "release-assets"
          $verifyDir = Join-Path $env:RUNNER_TEMP "verix-release-package-check"
          $zipPath = Join-Path $releaseDir "VERIX-Windows-x64.zip"

          if (!(Test-Path (Join-Path $publish "VERIX.exe"))) {
            throw "VERIX.exe is missing from the publish directory."
          }

          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          Compress-Archive -Path (Join-Path $publish "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir -Force

          # Verify the archive itself, not only the pre-archive publish directory.
          node tools/verify-portable-package.mjs $verifyDir
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged ZIP did not pass portable-package verification."
          }

          node -e "const fs=require('node:fs'); const {createHash}=require('node:crypto'); const file='release-assets/VERIX-Windows-x64.zip'; const hash=createHash('sha256').update(fs.readFileSync(file)).digest('hex'); fs.writeFileSync(file+'.sha256', hash+'  VERIX-Windows-x64.zip\\n', 'utf8'); console.log('SHA-256: '+hash);"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not generate the ZIP SHA-256 checksum."
          }

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VERIX-Windows-x64
          path: |
            release-assets/VERIX-Windows-x64.zip
            release-assets/VERIX-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/verix-v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified Windows release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: VERIX-Windows-x64
          path: release-assets

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          zip="release-assets/VERIX-Windows-x64.zip"
          checksum="release-assets/VERIX-Windows-x64.zip.sha256"

          test -s "$zip"
          test -s "$checksum"
          (cd release-assets && sha256sum --check VERIX-Windows-x64.zip.sha256)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" "$checksum" --clobber
          else
            args=(--title "VÉRIX Windows ${tag#verix-v}" --generate-notes --verify-tag)
            if [[ "$tag" =~ -(alpha|beta|rc)([.-]|$) ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" "$zip" "$checksum" "${args[@]}"
          fi
