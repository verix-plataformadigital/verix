name: VÉRIX Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "verix-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use pinned npm resolver
        run: npm install --global npm@12.2.0

      - name: Verify committed lockfile
        shell: pwsh
        run: |
          if (!(Test-Path package-lock.json) -or (Get-Item package-lock.json).Length -eq 0) {
            throw "package-lock.json must be committed before building the Windows release."
          }
          node -e "const p=require('./package-lock.json'); if(p.name!=='verix-release-security'||p.lockfileVersion!==3) process.exit(1)"

      - name: Install V2 dependencies
        run: npm ci --no-fund --no-audit

      - name: Build V2 local assets
        run: npm run build:v2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Publish portable host
        run: dotnet publish windows/VerixPortable/VerixPortable.csproj -c Release -r win-x64 --self-contained true --no-restore /p:PublishSingleFile=true

      - name: Verify V2-inclusive portable package
        run: node tools/verify-portable-package.mjs "windows/VerixPortable/bin/Release/net10.0-windows/win-x64/publish"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VERIX-Windows-x64
          path: windows/VerixPortable/bin/Release/net10.0-windows/win-x64/publish/
