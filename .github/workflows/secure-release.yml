name: VÉRIX Secure Release

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Optional custom BUILD_ID (leave empty for auto)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build secure release
        env:
          VERIX_BUILD_ID: ${{ inputs.build_id }}
        run: npm run build:secure

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: VERIX-secure-dist
          path: dist/
          retention-days: 14

      - name: Show manifest
        run: cat dist/build-manifest.json
