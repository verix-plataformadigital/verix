name: VÉRIX Secure Release

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Optional custom BUILD_ID (leave empty for auto)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Use pinned npm resolver
        run: npm install --global npm@12.2.0

      - name: Verify committed lockfile
        shell: bash
        run: |
          test -s package-lock.json || {
            echo "package-lock.json must be versioned; secure release builds cannot resolve dependencies dynamically."
            exit 1
          }
          node -e "const p=require('./package-lock.json'); if(p.name!=='verix-release-security'||p.lockfileVersion!==3) process.exit(1)"

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build secure release
        env:
          VERIX_BUILD_ID: ${{ inputs.build_id }}
        run: npm run build:secure

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VERIX-secure-dist
          path: dist/
          retention-days: 14

      - name: Show manifest
        run: cat dist/build-manifest.json
