<body style="margin:0;background:#010407">
<script>
(async function(){
  'use strict';

  // Check the service worker in the background; never delay opening VÉRIX.
  // It keeps entry-point navigations and the release manifest off the HTTP cache.
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('./sw.js', {
      scope: './',
      updateViaCache: 'none'
    }).catch(function () {});
  }
  try{
    const response=await fetch('./version.json?_='+Date.now(),{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache, no-store, max-age=0'}
    });
    if(!response.ok) throw new Error('Release manifest unavailable');
    const release=await response.json();
    if(!release || typeof release.buildId!=='string' || !release.buildId) throw new Error('Invalid release manifest');
    window.location.replace('./verix-app.html?_verix='+encodeURIComponent(release.buildId)+'&_mobile=1');
  }catch(_){
    window.location.replace('./verix-app.html?_verix='+Date.now()+'&_mobile=1');
  }
})();
</script>
<noscript>
<meta http-equiv="refresh" content="0;url=./verix-app.html">
